name: Set PR status to In Review

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  set-pr-status:
    # Draft PRs enter In Review when marked ready for review.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Add PR and set project status
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh project item-add 5 \
            --owner Ionnerss \
            --url "$PR_URL"

          gh project item-edit 5 \
            --owner Ionnerss \
            --url "$PR_URL" \
            --field "Status" \
            --value "In Review"