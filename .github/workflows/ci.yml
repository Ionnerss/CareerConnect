name: CI

on:
  push:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "ci-placeholder-not-a-real-key"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: SonarQube Scan
        if: >-
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           (github.base_ref == 'dev' || github.base_ref == 'main')) ||
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
           (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build application
        run: npm run build

  database:
    name: Database checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Reserve Supabase ports on the runner
        run: |
          existing="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=${existing:+${existing},}54320-54329"

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb #v1.7.3
        with:
          version: 2.122.1

      - name: Start local Supabase
        id: supabase_start
        run: supabase start

      - name: Show port usage if Supabase startup fails
        if: failure() && steps.supabase_start.outcome == 'failure'
        run: |
          sudo ss -tanp '( sport >= :54320 and sport <= :54329 )'
          docker ps --format 'table {{.Names}}\t{{.Ports}}'

      - name: Reset local database from migrations
        run: supabase db reset --no-seed

      - name: Run database tests
        run: supabase test db
